<div class="kd-bg">
  <div class="kd-bg__overlay"></div>

  <kd-navbar></kd-navbar>

  <main class="kd-page">
    <h1 class="kd-display kd-page__title">안녕하세요!</h1>
    <p class="kd-page__subtitle">Así te van a ver en Kalendar.</p>

    <kd-card class="kd-profile-card">
      <div class="kd-avatar">{{ initials }}</div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="kd-form">
        <div class="kd-field">
          <label for="name">Nombre</label>
          <input
            id="name"
            type="text"
            formControlName="name"
            [class.kd-field__input--error]="name.invalid && name.touched"
          />
          <span class="kd-field__error" *ngIf="name.invalid && name.touched">
            Ingresa tu nombre.
          </span>
        </div>

        <div class="kd-field">
          <label for="email">Correo electrónico</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            [class.kd-field__input--error]="email.invalid && email.touched"
          />
          <span class="kd-field__error" *ngIf="email.invalid && email.touched">
            Ingresa un correo válido.
          </span>
        </div>

        <div class="kd-field">
          <label for="bio">Bio</label>
          <textarea id="bio" formControlName="bio" rows="3" placeholder="Cuéntanos de ti..."></textarea>
        </div>

      </form>
    </kd-card>
    
<!-- Crear publicación: solo cafeterías -->
<section *ngIf="esCafeteria" class="kd-profile-posts">

  <button
    type="button"
    class="kd-create-post-btn"
    [disabled]="!puedePublicar"
    (click)="toggleFormularioPublicacion()"
  >
    {{ mostrarFormularioPublicacion
      ? '✕ Cancelar publicación'
      : '+ Crear publicación' }}
  </button>

  <p *ngIf="!puedePublicar" class="kd-posts-notice">
    Tu cafetería debe ser aprobada para crear publicaciones.
  </p>

<!-- Formulario para crear publicación -->
<div
  *ngIf="puedePublicar && mostrarFormularioPublicacion"
  class="kd-post-form"
>
  <h3>Crear publicación ♡</h3>

  <!-- Texto de la publicación -->
  <div class="kd-post-field">
    <label for="textoPublicacion">
      ¿Qué quieres compartir?
    </label>

    <textarea
      id="textoPublicacion"
      rows="5"
      placeholder="Que vas a publicar hoy?... "
    ></textarea>
  </div>

  <!-- Imagen opcional -->
  <div class="kd-post-field">
    <label for="imagenPublicacion">
       Agregar imagen (opcional)
    </label>

    <input
      id="imagenPublicacion"
      type="file"
      accept=".jpg,.jpeg,.png,.webp"
    />
  </div>

  <!-- Acciones -->
  <div class="kd-post-actions">
    <button
      type="button"
      class="kd-post-cancel"
      (click)="toggleFormularioPublicacion()"
    >
      Cancelar
    </button>

    <button
      type="button"
      class="kd-post-publish"
    >
      Publicar
    </button>
  </div>
</div>

 
</section>
<!-- Publicaciones de la cafetería -->
<section *ngIf="esCafeteria" class="kd-publicaciones-lista">
  <h2>Publicaciones</h2>

  <div class="kd-publicaciones-vacio">
    <p>Todavía nada de nada... u.u</p>
    <span>Las publicaciones de tu cafetería aparecerán aquí.</span>
  </div>
</section>
  </main>
</div>
